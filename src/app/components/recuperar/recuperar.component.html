<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
<div class="centrartodo">
  <div class="login">
    <div class="iniciar">
      <form (ngSubmit)="recuperar()">
        <div class="titulos">
          <h1>Olvidé mi contraseña</h1>
        </div>

        <div class="input-group">
          <h2>Nombre de usuario</h2>
          <input type="text" name="username" [(ngModel)]="username" required>

          <h2>Correo electrónico</h2>
          <input type="text" name="correo" [(ngModel)]="correo" required>

          <h2>Nueva contraseña</h2>
          <input type="password" name="nuevaContrasena" [(ngModel)]="nuevaContrasena" required>
        </div>

        <a href="" class="olvido">Volver a inicio</a>

        <div class="contenedor-boton">
          <button type="submit">Recuperar</button>
        </div>

        <p *ngIf="mensaje" style="color: green; text-align: center;">{{ mensaje }}</p>
      </form>
    </div>
  </div>
</div>
